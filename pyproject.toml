[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "HappyMeasure"
version = "1.1b6"
description = "HappyMeasure 1.1b6 beta for Keithley-style IV and Time workflows"
requires-python = ">=3.11"
dependencies = [
  "matplotlib>=3.8,<4",
  "pyserial==3.5",
]

[project.scripts]
HappyMeasure = "happymeasure.__main__:run"
happymeasure = "happymeasure.__main__:run"
happymeasure-preflight = "happymeasure.hardware_preflight:main"
map-reconstruction = "map_reconstruction.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
keith_ivt = ["assets/*.png", "assets/*.ico"]
map_reconstruction = ["assets/*.png", "assets/*.ico"]

[project.optional-dependencies]
dev = [
  "pytest>=7.0",
  "pytest-cov>=4.0",
  "numpy==2.3.5",
  "ruff==0.15.22",
  "black>=23.0",
  "mypy>=1.0",
  "types-pyserial>=3.5.0",
]
map = [
  "PySide6>=6,<7",
  "pyqtgraph>=0.13,<1",
  "numpy>=2,<3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-q"

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint.per-file-ignores]
"tests/*.py" = ["E402"]
"tests/**/*.py" = ["E402"]

[tool.mypy]
python_version = "3.11"
warn_unused_configs = true
disallow_untyped_defs = false

[tool.coverage.run]
omit = [
  "src/keith_ivt/hardware_preflight.py",
  "src/keith_ivt/diagnostics/*",
  "src/keith_ivt/ui/*",
  "src/keith_ivt/sweeps/*",
  "src/keith_ivt/core/adaptive_logic.py",
  "src/keith_ivt/core/adaptive_rules.py",
  "src/keith_ivt/data/importers.py",
  "src/keith_ivt/logging_config.py",
  "src/keith_ivt/app_config.py",
  "src/keith_ivt/__main__.py",
  "src/happymeasure/*",
  "src/map_reconstruction/ui/*",
  "src/map_reconstruction/__main__.py",
]

[tool.coverage.report]
show_missing = true
skip_empty = true
fail_under = 95
