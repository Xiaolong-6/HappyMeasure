name: Refresh release screenshots

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-screenshots
  cancel-in-progress: true

jobs:
  capture:
    name: Capture current source GUI release screenshots
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install source GUI dependencies
        run: python -m pip install -e ".[dev,map]"
      - name: Capture release screenshots
        run: python tools/release/capture_release_screenshots.py
      - name: Upload captured screenshots for review
        uses: actions/upload-artifact@v6
        with:
          name: release-screenshots-${{ github.sha }}
          path: docs/screenshots/*.png
          if-no-files-found: error
          retention-days: 7
