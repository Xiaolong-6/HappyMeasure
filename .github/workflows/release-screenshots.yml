name: Refresh release screenshots

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/release-screenshots.yml"
      - "tools/release/capture_release_screenshots.py"

permissions:
  contents: write

concurrency:
  group: release-screenshots
  cancel-in-progress: true

jobs:
  capture:
    name: Capture frozen 1.2b source GUI screenshots
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install source GUI dependencies
        run: python -m pip install -e ".[dev,map]"
      - name: Capture release screenshots
        run: python tools/release/capture_release_screenshots.py
      - name: Commit refreshed screenshots
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/screenshots/*.png
          if (git diff --cached --quiet) {
              Write-Host "Screenshots already match the frozen source GUI."
              exit 0
          }
          git commit -m "docs: refresh 1.2b source GUI screenshots"
          git push origin HEAD:main
