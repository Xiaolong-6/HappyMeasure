name: Temporary release formatter

on:
  push:
    branches: [codex/release-1.1b6-hardening]

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: codex/release-1.1b6-hardening
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install Black
        run: python -m pip install black==26.5.1
      - name: Format Python sources and tests
        run: python -m black src tests
      - name: Commit formatting only when needed
        shell: bash
        run: |
          if git diff --quiet -- src tests; then
            echo "No formatting changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src tests
          git commit -m "style: apply Black formatting"
          git push origin HEAD:codex/release-1.1b6-hardening
