name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  version-policy:
    name: Version policy
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Check push commit-by-commit version sequence
        if: github.event_name == 'push'
        run: python tools/release/check_version_sequence.py --base "${{ github.event.before }}" --head "${{ github.sha }}"
      - name: Check pull-request commit-by-commit version sequence
        if: github.event_name == 'pull_request'
        run: python tools/release/check_version_sequence.py --base "${{ github.event.pull_request.base.sha }}" --head "${{ github.event.pull_request.head.sha }}"

  test:
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install project and developer tools
        run: python -m pip install -e ".[dev]"
      - name: Compile sources and tests
        run: python -m compileall -q src tests tools/release
      - name: Check formatting
        run: python -m black --check --diff src tests tools/release
      - name: Lint
        run: python -m ruff check src tests tools/release
      - name: Type check core HappyMeasure
        run: python -m mypy src/keith_ivt src/happymeasure
      - name: Run core test suite
        run: python -m pytest -q tests/common tests/happymeasure
      - name: Enforce core coverage
        if: matrix.python-version == '3.14'
        run: python -m pytest tests/common tests/happymeasure --cov=keith_ivt --cov-report=term -q

  map-ui:
    name: Map Reconstruction UI (Windows / Python 3.12)
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      QT_QPA_PLATFORM: offscreen

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Map Reconstruction release-gate dependencies
        run: python -m pip install -e ".[dev,map]"
      - name: Require Qt dependencies
        run: python -c "import PySide6, pyqtgraph; print(PySide6.__version__, pyqtgraph.__version__)"
      - name: Compile Map Reconstruction sources and tests
        run: python -m compileall -q src/map_reconstruction tests/map_reconstruction
      - name: Check Map Reconstruction formatting
        run: python -m black --check --diff src/map_reconstruction tests/map_reconstruction
      - name: Lint Map Reconstruction
        run: python -m ruff check src/map_reconstruction tests/map_reconstruction
      - name: Type check Map Reconstruction
        run: python -m mypy src/map_reconstruction
      - name: Run Map Reconstruction release gate
        run: python -m pytest -vv --durations=20 tests/map_reconstruction
