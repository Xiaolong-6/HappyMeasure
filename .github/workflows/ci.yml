name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  version-policy:
    name: Version policy
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Check push commit-by-commit version sequence
        if: github.event_name == 'push'
        run: python tools/release/check_version_sequence.py --base "${{ github.event.before }}" --head "${{ github.sha }}"
      - name: Check pull-request commit-by-commit version sequence
        if: github.event_name == 'pull_request'
        run: python tools/release/check_version_sequence.py --base "${{ github.event.pull_request.base.sha }}" --head "${{ github.event.pull_request.head.sha }}"

  test:
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install project and developer tools
        run: python -m pip install -e ".[dev]"
      - name: Compile sources and tests
        run: python -m compileall -q src tests tools/release
      - name: Check formatting
        run: python -m black --check --diff src tests tools/release
      - name: Lint
        run: python -m ruff check src tests tools/release
      - name: Type check core HappyMeasure
        run: python -m mypy src/keith_ivt src/happymeasure
      - name: Run core test suite
        run: python -m pytest -q tests/common tests/happymeasure
      - name: Enforce core coverage
        if: matrix.python-version == '3.14'
        run: python -m pytest tests/common tests/happymeasure --cov=keith_ivt --cov-report=term -q

  package-smoke:
    name: Windows portable package smoke (Python 3.12)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [version-policy, test]
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Build HappyMeasure portable
        shell: pwsh
        run: .\tools\build\Build_Portable_Windows_App.ps1
      - name: Audit portable contents, privacy and hashes
        run: python tools/release/audit_portable_artifacts.py --dist dist --manifest dist/release-artifacts.json
      - name: Smoke frozen executable
        shell: pwsh
        run: |
          function Assert-StaysAlive([string]$Path, [int]$Seconds = 6) {
              Write-Host "Launching $Path"
              $process = Start-Process -FilePath $Path -PassThru
              Start-Sleep -Seconds $Seconds
              if ($process.HasExited) {
                  throw "$Path exited early with code $($process.ExitCode)."
              }
              Stop-Process -Id $process.Id -Force
              $process.WaitForExit()
              Write-Host "$Path stayed alive for $Seconds seconds."
          }

          Assert-StaysAlive "dist\HappyMeasure\HappyMeasure.exe"
      - name: Upload audited portable release candidate
        uses: actions/upload-artifact@v6
        with:
          name: windows-portable-${{ github.sha }}
          path: |
            dist/HappyMeasure-*-windows-portable.zip
            dist/release-artifacts.json
          if-no-files-found: error
          retention-days: 14
